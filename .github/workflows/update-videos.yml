name: Automate Video Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Video Sync Script
        run: node scripts/sync-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Check for changes
        id: check
        run: |
          git add data/videos.ts
          if git diff --cached --quiet; then
            echo "No new videos found. Skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review PR instead of pushing to main
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Branch from current HEAD (latest main at run start) — preserves the sync'd file
          git checkout -B video-sync
          git add data/videos.ts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: video hub sync — new YouTube videos"
          git push --force origin video-sync

          # Create the PR only if one isn't already open on this branch
          if ! gh pr view video-sync --json number --jq '.number' 2>/dev/null; then
            gh pr create \
              --base main \
              --head video-sync \
              --title "chore: video hub sync — review before deploy" \
              --body "Auto-generated by the 6-hourly video sync. Review the changes to \`data/videos.ts\`, then merge to deploy. Merging to main triggers the deploy workflow."
          else
            echo "PR already open for video-sync branch — updated it in place."
          fi
